[project]
name = "repobehave-gen"
version = "0.1.0"
description = "Automated generator of runtime-behavior QA benchmark instances (RepoBehave-style)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
repogen = "repogen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repogen*"]

[tool.setuptools.package-data]
repogen = ["payload/**/*", "prompts/**/*"]
